name: Release

# Publie une version installable ET auto-actualisable : installeur Windows et
# AppImage Linux signés, plus le manifeste `latest.json` que l'application
# interroge au démarrage (voir `plugins.updater` dans tauri.conf.json).
#
# Déclenchement manuel : on publie quand on le décide, pas à chaque push.
# Avant de lancer, augmenter `version` dans package.json — c'est la seule
# source de vérité (tauri.conf.json la lit), et la release est étiquetée
# `v<version>`. Relancer sur une version déjà publiée ne fait que réécrire
# ses fichiers : les postes déjà à jour ne verraient rien.
#
# Prérequis, une seule fois (voir RELEASE.md) :
#   - secret   TAURI_SIGNING_PRIVATE_KEY          clé privée de signature
#   - secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD son mot de passe (peut être vide)
#   - variable TAURI_UPDATER_PUBKEY               clé publique correspondante
#
# Les deux plateformes sont deux jobs distincts plutôt qu'une matrice : Linux se
# construit dans un conteneur Debian 13, ce que le runner Windows ne sait pas
# faire. tauri-action réunit leurs fichiers dans la même release et le même
# `latest.json`.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: |
    Les installations existantes proposeront cette version au prochain lancement.

    - **Windows** : `Cobblestone_*_x64-setup.exe`
    - **Linux** (Debian 13 ou plus récent) : `Cobblestone_*_amd64.AppImage`

jobs:
  windows:
    name: Release Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration de signature
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ou variable TAURI_UPDATER_PUBKEY manquant : voir RELEASE.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      # La clé publique n'est pas commitée : elle est injectée ici, avec
      # l'activation des artefacts de mise à jour. Les builds de test (workflows
      # « Build Windows » / « Build Linux ») restent ainsi sans signature et
      # sans vérification de mise à jour.
      - name: Configuration de release
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PLATFORM_CONFIG: '{}'
        run: |
          node -e '
            const config = JSON.parse(process.env.PLATFORM_CONFIG);
            config.bundle = { ...config.bundle, createUpdaterArtifacts: true };
            config.plugins = { updater: { pubkey: process.env.PUBLIC_KEY } };
            require("fs").writeFileSync("tauri.release.conf.json", JSON.stringify(config, null, 2));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lu par Vite au build : active la vérification des mises à jour.
          VITE_UPDATER_ENABLED: 'true'
        with:
          tagName: v__VERSION__
          releaseName: Cobblestone v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config tauri.release.conf.json

  linux:
    name: Release Linux
    runs-on: ubuntu-24.04
    # Même environnement que le workflow « Build Linux », pour les mêmes raisons
    # (#44) : l'AppImage doit embarquer les bibliothèques de Debian 13.
    container: debian:trixie
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true

    steps:
      - name: Installer les dépendances système Tauri
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            file \
            pkg-config \
            build-essential \
            patchelf \
            xdg-utils \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev

      - uses: actions/checkout@v4

      - name: Vérifier la configuration de signature
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ou variable TAURI_UPDATER_PUBKEY manquant : voir RELEASE.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      # Seule l'AppImage sait se mettre à jour toute seule : le .deb reste
      # disponible via le workflow « Build Linux » pour qui préfère apt.
      - name: Configuration de release
        env:
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PLATFORM_CONFIG: '{"bundle":{"targets":["appimage"]}}'
        run: |
          node -e '
            const config = JSON.parse(process.env.PLATFORM_CONFIG);
            config.bundle = { ...config.bundle, createUpdaterArtifacts: true };
            config.plugins = { updater: { pubkey: process.env.PUBLIC_KEY } };
            require("fs").writeFileSync("tauri.release.conf.json", JSON.stringify(config, null, 2));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_ENABLED: 'true'
        with:
          tagName: v__VERSION__
          releaseName: Cobblestone v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config tauri.release.conf.json

[package]
name = "cobblestone"
version = "0.1.0"
description = "Clone d'Obsidian pour monorepo, notes personnelles et wiki d'entreprise"
authors = ["Cobblestone"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cobblestone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# La coquille native est volontairement minimale : aucune commande métier,
# uniquement l'enregistrement des plugins officiels. Toute la logique vit dans
# `src/core/`, en TypeScript, testable sans toolchain Rust.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
